name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Go toolchain that compiles the bundled cloudflared. Its crypto/x509 decides which certificate
  # chains cloudflared trusts (go1.27.3 distrusts the weak-key eMudhra intermediates, GO-2026-6809),
  # so it is part of the cloudflared cache key: changing it rebuilds the binary.
  CLOUDFLARED_GO_VERSION: '1.27.3'

# The jobs below are independent — none consumes another's artifacts; each checks out fresh,
# rebuilds its native deps from cache, and runs its own Gradle tasks. They therefore run in
# PARALLEL on separate runners instead of in a needs: chain. The former chain existed only as a
# fail-fast gate; we trade that for faster feedback. Do NOT re-add needs: unless a real artifact
# dependency is introduced.
#
# There is deliberately no E2E job: the redroid-based :e2e-tests suite only ever failed in CI
# and cost ~45 minutes per run. The live tunnel integration tests are likewise excluded from the
# unit-test job by their `live-integration` JUnit tag (see app/build.gradle.kts); they remain
# runnable locally with -PrunLiveIntegrationTests.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          # Full history + tags: build.gradle.kts derives versionName/versionCode from
          # git and fails configuration without them (no hardcoded fallback).
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache ngrok-java JAR
        id: cache-ngrok-jar
        uses: actions/cache@v6
        with:
          path: vendor/ngrok-java/ngrok-java/target/ngrok-java-1.2.0-SNAPSHOT.jar
          key: ngrok-jar-v2-${{ runner.os }}-${{ hashFiles('vendor/ngrok-java/ngrok-java/pom.xml', 'vendor/ngrok-java/ngrok-java/src/**') }}

      - name: Build ngrok-java JAR (required for Gradle classpath)
        if: steps.cache-ngrok-jar.outputs.cache-hit != 'true'
        run: |
          cd vendor/ngrok-java
          mvn package -pl ngrok-java -DskipTests --global-toolchains toolchains.xml -q
        env:
          JAVA_11_HOME: ${{ env.JAVA_HOME }}
          JAVA_17_HOME: ${{ env.JAVA_HOME }}

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Run detekt
        run: ./gradlew detekt

  test-unit:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          # Full history + tags: build.gradle.kts derives versionName/versionCode from
          # git and fails configuration without them (no hardcoded fallback).
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache ngrok-java JARs
        id: cache-ngrok-jars
        uses: actions/cache@v6
        with:
          path: |
            vendor/ngrok-java/ngrok-java/target/ngrok-java-1.2.0-SNAPSHOT.jar
            vendor/ngrok-java/ngrok-java-native/target/ngrok-java-native-classes.jar
          key: ngrok-jars-v1-${{ runner.os }}-${{ hashFiles('vendor/ngrok-java/pom.xml', 'vendor/ngrok-java/ngrok-java/pom.xml', 'vendor/ngrok-java/ngrok-java/src/**', 'vendor/ngrok-java/ngrok-java-native/pom.xml', 'vendor/ngrok-java/ngrok-java-native/src/**') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Compiling the tests needs only the ngrok-java API jar and the ngrok-java-native Java
      # classes jar — both plain JVM artifacts. The tests that exercise the native host library
      # or a real cloudflared binary are tagged `live-integration` and are excluded here, so no
      # Rust/native build and no cloudflared install are required.
      - name: Build ngrok-java JARs (required for Gradle classpath)
        if: steps.cache-ngrok-jars.outputs.cache-hit != 'true'
        run: |
          cd vendor/ngrok-java
          mvn package -pl ngrok-java -DskipTests --global-toolchains toolchains.xml -q
          mvn compile -pl ngrok-java-native --also-make --global-toolchains toolchains.xml -q
          (cd ngrok-java-native/target/classes && jar cf ../ngrok-java-native-classes.jar com/)
        env:
          JAVA_11_HOME: ${{ env.JAVA_HOME }}
          JAVA_17_HOME: ${{ env.JAVA_HOME }}

      - name: Run unit tests with coverage
        run: ./gradlew :app:test :privacy:test :privacy-benchmark:test jacocoTestReport

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: app/build/reports/tests/
          retention-days: 14

      - name: Upload Jacoco coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            app/build/reports/jacoco/jacocoTestReport/html/
            app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          retention-days: 14

  build-release:
    name: Build Release - ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # One runner per flavour so gms and foss assemble in parallel instead of one job
    # building all four APKs serially. fail-fast off: a foss break must not cancel gms.
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: gms
            label: GMS
            cap: Gms
          - flavor: foss
            label: FOSS
            cap: Foss
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          # Full history + tags: build.gradle.kts derives versionName/versionCode from
          # git and fails configuration without them (no hardcoded fallback). On
          # pull_request runs this reflects the ephemeral merge ref, not the post-merge
          # main commit; these artifacts are unsigned and never shipped.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Resolve cloudflared build inputs
        id: cloudflared-inputs
        # The binary also depends on the submodule commit (version stamp, VCS info) and on the NDK
        # clang that compiles and links it, the newest NDK as the Makefile picks it.
        run: |
          echo "commit=$(git rev-parse HEAD:vendor/cloudflared)" >> "$GITHUB_OUTPUT"
          echo "ndk=$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Cache cloudflared Android native
        id: cache-cloudflared
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libcloudflared.so
            app/src/main/jniLibs/x86_64/libcloudflared.so
          key: cloudflared-android-${{ runner.os }}-go${{ env.CLOUDFLARED_GO_VERSION }}-ndk${{ steps.cloudflared-inputs.outputs.ndk }}-${{ steps.cloudflared-inputs.outputs.commit }}-${{ hashFiles('.gitmodules', 'Makefile', 'vendor/cloudflared/**/*.go', 'vendor/cloudflared/go.mod', 'vendor/cloudflared/go.sum') }}

      - name: Cache ngrok-java Android native
        id: cache-ngrok-android
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libngrok_java.so
            app/src/main/jniLibs/x86_64/libngrok_java.so
            vendor/ngrok-java/ngrok-java/target/ngrok-java-1.2.0-SNAPSHOT.jar
            vendor/ngrok-java/ngrok-java-native/target/ngrok-java-native-classes.jar
          key: ngrok-android-v2-${{ runner.os }}-${{ hashFiles('.gitmodules', 'vendor/ngrok-java/**/*.toml', 'vendor/ngrok-java/**/pom.xml', 'vendor/ngrok-java/ngrok-java-native/src/**', 'vendor/ngrok-java/**/Cargo.lock', 'vendor/ngrok-java/ngrok-java-native/build.rs') }}

      - name: Set up Go
        if: steps.cache-cloudflared.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.CLOUDFLARED_GO_VERSION }}

      - name: Set up Rust
        if: steps.cache-ngrok-android.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile cloudflared for Android
        if: steps.cache-cloudflared.outputs.cache-hit != 'true'
        run: make compile-cloudflared

      - name: Compile ngrok-java native for Android
        if: steps.cache-ngrok-android.outputs.cache-hit != 'true'
        run: make compile-ngrok-native
        env:
          JAVA_11_HOME: ${{ env.JAVA_HOME }}
          JAVA_17_HOME: ${{ env.JAVA_HOME }}

      - name: Set up Python (geolocation DB generator)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compute DB-IP month
        id: dbip-month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache DB-IP source CSV
        uses: actions/cache@v6
        with:
          path: .dbip-cache
          key: dbip-csv-${{ steps.dbip-month.outputs.month }}

      - name: Build ${{ matrix.label }} debug + release APKs
        run: ./gradlew assemble${{ matrix.cap }}Debug assemble${{ matrix.cap }}Release

      - name: Upload ${{ matrix.label }} debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.flavor }}-debug
          path: app/build/outputs/apk/${{ matrix.flavor }}/debug/app-${{ matrix.flavor }}-debug.apk
          retention-days: 30

      - name: Upload ${{ matrix.label }} release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.flavor }}-release
          path: app/build/outputs/apk/${{ matrix.flavor }}/release/app-${{ matrix.flavor }}-release-unsigned.apk
          retention-days: 30
