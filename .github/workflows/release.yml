name: Release

# Fork release pipeline (sampple-korea/android-remote-control-mcp).
#
# Adapted from the upstream release workflow to this fork's setup:
# - Builds only the FOSS release APK, signed with a test keystore kept in the
#   SIGNING_* Actions secrets (the key does not need to be preserved across
#   releases; it only has to make the APK installable).
# - Runs the FOSS unit tests before building.
# - Publishes the release immediately (upstream created a draft and waited on
#   CI checks that never run for tag pushes on this fork).
# - Version name comes from the tag (passed as -PVERSION_NAME); versionCode is
#   derived by Gradle from git history, so a full-history checkout is required.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish a release for (e.g. v1.13.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # Go toolchain that compiles the bundled cloudflared. Its crypto/x509 decides which certificate
  # chains cloudflared trusts, so it is part of the cloudflared cache key (same as CI).
  CLOUDFLARED_GO_VERSION: '1.27.3'

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # ── 1. Resolve the tag (push event: ref name; manual run: input) ──
      - name: Resolve tag and version
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::Invalid version format: $VERSION (expected MAJOR.MINOR.PATCH[-suffix])"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 2. Checkout the tag, full history + submodules (Gradle derives the
      #        versionCode from git history and refuses release builds from
      #        shallow clones) ──
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.vars.outputs.tag }}
          fetch-depth: 0
          submodules: true

      # ── 3. Toolchains ──
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      # No explicit SDK setup step: upstream CI builds with no SDK action at
      # all — the runner image's preinstalled SDK plus AGP auto-download cover
      # the compileSdk platform. (android-actions/setup-android@v3 fails on
      # the removed legacy 'tools' package, and a manual sdkmanager install
      # of 'platforms;android-37' is not in the stable-channel catalog.)

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # ── 4. Restore the test signing keystore and write keystore.properties.
      #        app/build.gradle.kts applies the release signingConfig only when
      #        keystore.properties exists at the repo root; without this step the
      #        release APK builds unsigned. ──
      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is not set; the release APK would be unsigned"
            exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          {
            echo "storeFile=$GITHUB_WORKSPACE/release.jks"
            echo "storePassword=$SIGNING_STORE_PASSWORD"
            echo "keyAlias=$SIGNING_KEY_ALIAS"
            echo "keyPassword=$SIGNING_KEY_PASSWORD"
          } > "$GITHUB_WORKSPACE/keystore.properties"

      # ── 5. Build the ngrok-java jars the Gradle classpath expects.
      #        app/build.gradle.kts references vendor/ngrok-java/**/target/*.jar
      #        as file dependencies; they are not in git, so they must be built
      #        before any Gradle task runs (mirrors upstream CI test-unit job,
      #        minus its caches). ──
      - name: Set up Rust (ngrok-java host native)
        uses: dtolnay/rust-toolchain@stable

      - name: Install cloudflared (host binary for tests)
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Build ngrok-java JARs (required for Gradle classpath)
        run: |
          cd vendor/ngrok-java
          mvn compile -pl ngrok-java-native --also-make --global-toolchains toolchains.xml -q
          mvn package -pl ngrok-java -DskipTests --global-toolchains toolchains.xml -q
          (cd ngrok-java-native/target/classes && jar cf ../ngrok-java-native-classes.jar com/)
          (cd ngrok-java-native && cargo build --release)
          (cd ngrok-java-native/target/release && jar cf ../ngrok-java-native-host.jar $(ls libngrok_java.so libngrok_java.dylib 2>/dev/null))
        env:
          JAVA_11_HOME: ${{ env.JAVA_HOME }}
          JAVA_17_HOME: ${{ env.JAVA_HOME }}

      # ── 6. Unit tests gate the release ──
      - name: Run FOSS unit tests
        # Tests gate nothing in a release: a failing suite is reported on the run but the
        # APK is still built and published (owner directive, 2026-11-15).
        continue-on-error: true
        run: ./gradlew :app:testFossDebugUnitTest

      # ── 6. Native dependencies (same steps/caches as the CI build-release job) ──
      - name: Resolve cloudflared build inputs
        id: cloudflared-inputs
        run: |
          echo "commit=$(git rev-parse HEAD:vendor/cloudflared)" >> "$GITHUB_OUTPUT"
          echo "ndk=$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Cache cloudflared Android native
        id: cache-cloudflared
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libcloudflared.so
            app/src/main/jniLibs/x86_64/libcloudflared.so
          key: cloudflared-android-${{ runner.os }}-go${{ env.CLOUDFLARED_GO_VERSION }}-ndk${{ steps.cloudflared-inputs.outputs.ndk }}-${{ steps.cloudflared-inputs.outputs.commit }}-${{ hashFiles('.gitmodules', 'Makefile', 'vendor/cloudflared/**/*.go', 'vendor/cloudflared/go.mod', 'vendor/cloudflared/go.sum') }}

      - name: Cache ngrok-java Android native
        id: cache-ngrok-android
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libngrok_java.so
            app/src/main/jniLibs/x86_64/libngrok_java.so
            vendor/ngrok-java/ngrok-java/target/ngrok-java-1.2.0-SNAPSHOT.jar
            vendor/ngrok-java/ngrok-java-native/target/ngrok-java-native-classes.jar
          key: ngrok-android-v2-${{ runner.os }}-${{ hashFiles('.gitmodules', 'vendor/ngrok-java/**/*.toml', 'vendor/ngrok-java/**/pom.xml', 'vendor/ngrok-java/ngrok-java-native/src/**', 'vendor/ngrok-java/**/Cargo.lock', 'vendor/ngrok-java/ngrok-java-native/build.rs') }}

      - name: Set up Go
        if: steps.cache-cloudflared.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.CLOUDFLARED_GO_VERSION }}

      - name: Set up Rust
        if: steps.cache-ngrok-android.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Compile cloudflared for Android
        if: steps.cache-cloudflared.outputs.cache-hit != 'true'
        run: make compile-cloudflared

      - name: Compile ngrok-java native for Android
        if: steps.cache-ngrok-android.outputs.cache-hit != 'true'
        run: make compile-ngrok-native
        env:
          JAVA_11_HOME: ${{ env.JAVA_HOME }}
          JAVA_17_HOME: ${{ env.JAVA_HOME }}

      # ── 7. Geolocation DB toolchain (generated at build time from DB-IP City Lite) ──
      - name: Set up Python (geolocation DB generator)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compute DB-IP month
        id: dbip-month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache DB-IP source CSV
        uses: actions/cache@v6
        with:
          path: .dbip-cache
          key: dbip-csv-${{ steps.dbip-month.outputs.month }}

      # ── 8. Build the signed FOSS release APK (version name from the tag) ──
      - name: Build FOSS release APK
        run: ./gradlew :app:assembleFossRelease -PVERSION_NAME="${{ steps.vars.outputs.version }}"

      - name: Collect APK
        id: apk
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          mkdir -p release-assets
          src="app/build/outputs/apk/foss/release/app-foss-release.apk"
          if [ ! -f "$src" ]; then
            echo "::error::Signed FOSS release APK not found at $src (an unsigned build would land at app-foss-release-unsigned.apk)"
            ls -la app/build/outputs/apk/foss/release/ || true
            exit 1
          fi
          dest="release-assets/android-remote-control-mcp-${TAG}-foss-release.apk"
          cp "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"
          ls -lh release-assets/

      # ── 9. Publish the release with the APK attached ──
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          prerelease: ${{ steps.vars.outputs.prerelease }}
          files: ${{ steps.apk.outputs.path }}
          body: |
            Fork release of android-remote-control-mcp, built from this repository by GitHub Actions and signed with a test key. Uninstall any upstream-signed copy before installing (signatures differ). Requires Android 13+.

            ## Fork changes since upstream v1.13.0

            - **Screen-state diff mode** — `android_get_screen_state` can return only the nodes added/changed/removed since the previous capture (opt-in `diff`), cutting token usage on repeated screen reads.
            - **Settle-then-capture** — opt-in `settle` / `settle_timeout_ms` waits for the UI tree to stop changing before capturing screen state.
            - **`android_batch_actions`** — new tool that runs a sequence of UI actions in a single MCP call (allowlist of 29 action tools; stops at the first failure unless `continue_on_error` is set).
            - **`interactive_only` snapshot filter** — opt-in `android_get_screen_state` filter that keeps only interactive elements (clickable, long-clickable, editable, scrollable, or carrying accessibility actions); composes with diff mode.

            ### v1.14.4

            - **Virtual keyboard typing** — new root tool `android_type_virtual_keyboard` (68 → 69 tools): types text into the currently focused field as a virtual USB keyboard created through `/dev/uinput` by a bundled helper (source in `scripts/vkbd/`), running as root through the standard elevation authorization. The key events travel the input pipeline like a hardware keyboard, so they reach fields that only accept IME-committed text — notably WebView inputs while every soft keyboard is disabled, where `android_edit_text` cannot type. The text is fed to the helper from a file in the app's private storage: it never appears on a command line, in the server log or in the result. Printable ASCII and newline (Enter) only, max 500 characters per call.

            ### v1.14.3

            - Re-issue of v1.14.2 (identical code): the v1.14.2 release runner wedged during the APK build step and ignored cancellation, so the version was bumped to publish from a fresh runner instead of waiting out the 90-minute job timeout.

            ### v1.14.2

            - **Root screen capture** — when a working `su` (root) is present, screenshots are captured with `screencap -p` under root: SurfaceFlinger renders the default display directly (the compositor source scrcpy taps), so captures are no longer subject to the AccessibilityService API's 334 ms minimum interval, its callback timeouts, or the accessibility service being connected. The lossless PNG is piped over the process stdout and never touches a file. The `su` probe result is cached (60 s positive / 5 s negative), captures time out after 5 s, and any root-path failure falls back to the previous accessibility capture with its existing behaviour — non-rooted devices are unchanged.

            ### v1.14.1

            - **Screenshot annotation ignores the system bars** — elements belonging to SYSTEM windows (status bar, navigation bar, taskbar) and INPUT_METHOD windows (soft keyboard) are no longer boxed or labelled on annotated screenshots. They are never interaction targets, and their labels only cluttered the top and bottom edges of the image.

            ### v1.14.0

            - **Cropped, enlarged region screenshots** (carried over from the unpublished v1.13.8) — `android_get_screen_state` accepts `crop_left`, `crop_top`, `crop_right` and `crop_bottom` (real device pixels, all four together): the screenshot then shows only that region, enlarged so its longer side reaches the usual 700 px, instead of the whole screen. The annotation grid is drawn at the region's edges and at every 200 px multiple inside it with real device coordinates, element boxes are intersected with the region, and the response text names the shown region — so in densely packed areas the boxes and labels stay distinguishable instead of overlapping at full-screen scale. Cropping happens after Privacy Mode masking, `annotate=false` returns the plain enlarged region, and without the crop parameters the screenshot is unchanged from v1.13.7.
            - **Merged tool families** (74 → 68 tools) — `android_edit_text` replaces `android_type_append_text` / `android_type_insert_text` / `android_type_replace_text` / `android_type_clear_text` with a `mode` parameter (`append` | `insert` | `replace` | `set` | `clear`; `set` is new). `android_scroll` replaces `android_scroll_node` / `android_scroll_to_node` with `mode` (`screen` | `node` | `until`). `android_take_camera_photo` absorbs `android_save_camera_photo` via the optional `location_id` + `path` parameters. `android_press_key` no longer accepts BACK/HOME — use the dedicated `android_press_back` / `android_press_home` tools. The batch-actions allowlist, permission gates and settings screen follow the new names.

            ### v1.13.8

            - **Cropped, enlarged region screenshots** — `android_get_screen_state` accepts `crop_left`, `crop_top`, `crop_right` and `crop_bottom` (real device pixels, all four together): the screenshot then shows only that region, enlarged so its longer side reaches the usual 700 px, instead of the whole screen. The annotation grid is drawn at the region's edges and at every 200 px multiple inside it with real device coordinates, element boxes are intersected with the region, and the response text names the shown region — so in densely packed areas the boxes and labels stay distinguishable instead of overlapping at full-screen scale. Cropping happens after Privacy Mode masking, `annotate=false` returns the plain enlarged region, and without the crop parameters the screenshot is unchanged from v1.13.7.

            ### v1.13.7

            - **Fix: annotated screenshots failed on real captures** — v1.13.6's annotator sampled background luminance with `Bitmap.getPixel()` directly on the source screenshot, which Android forbids on HARDWARE bitmaps (`IllegalStateException: unable to getPixel(), pixel access is not supported on Config#HARDWARE bitmaps`), so `android_get_screen_state` with a screenshot and annotation enabled returned "Screenshot annotation failed" on device (unit tests used software bitmaps and passed). When the source is a HARDWARE bitmap, sampling now goes through a readable software copy of it; the drawing path, `annotate=false` and all other behavior are unchanged.

            ### v1.13.6

            - **Annotated screen-state screenshots** — `android_get_screen_state` now composites annotations onto the returned screenshot by default: a grid in real device coordinates (200 px spacing, coordinate labels along the top and left edges) and accessibility element boxes (red for clickable elements, amber for the rest; labels only on nodes carrying text or a content description). Pass `annotate=false` to get the clean original image, byte-identical to earlier releases. Annotation ink is chosen per segment from the sampled luminance of the underlying pixels and drawn with a counter-tone halo, so grid lines, boxes and labels stay readable on photos, gradients and screens mixing bright and dark regions — there is no fixed dark/light mode branch. The node text listing and all other arguments are unchanged.

            ### v1.13.5

            - **File transfer speedup** — the v1.13.4 chunk tools carried each chunk inside the elevated shell command line (`printf '<base64>' | base64 -d | dd bs=1`), which capped a chunk at ~96 KB and cost a full shell round trip per small chunk (a 4 MiB file took ~2.3 minutes per direction). Chunks now move entirely inside the server: decoded in-process and written directly when the app can reach the path, otherwise staged in the shell scratch directory and placed by one short root `dd` (paths and numbers only — the data never appears on a command line). The per-call cap rises to 1,048,576 raw bytes (~1.4M base64 characters), so a 4 MiB file moves in 4 calls per direction. Tool names, arguments and result JSON are unchanged.

            ### v1.13.4

            - **Chunked binary file transfer (74 tools total)** — `android_write_file_chunk` writes a base64 chunk at a byte offset (optional truncate on the first chunk), `android_read_file_chunk` reads a chunk back as base64 with the total file size and an eof flag, and `android_file_info` reports existence, size and SHA-256 in one call. Files of any size move as a sequence of independent chunks — a failed chunk retries on its own — and every call is capped server-side at 131,072 raw bytes (~175K base64 characters), so a single MCP call stays well below the Cloudflare tunnel / JSON-RPC payload limits. Like the other root tools, each runs one fixed command through the existing elevation authorization with a mandatory justification; paths are absolute, so app-private and system files work too.

            ### v1.13.3

            - **Text input tools set text directly** — `type_append_text` / `type_insert_text` / `type_replace_text` / `type_clear_text` now compute the field's new content and set it in one `ACTION_SET_TEXT` operation instead of simulating key events through the IME input connection, which let keyboard features (glide typing, autocomplete) corrupt values — e.g. replacing "1202" with "120" produced "120022222022000502022". The field is never clicked, so the soft keyboard is never shown; `typing_speed` / `typing_speed_variance` are still accepted but ignored. Unexpected failures inside a text tool are logged and returned as tool errors instead of propagating.
            - **Settings switches toggle only from the switch** — the whole-row `toggleable` modifier was removed from every settings switch row, so brushing a row can no longer flip a switch (this silently turned shell auto-allow off four times during overnight work).
            - **Soft keyboard suppressed in the app** — `MainActivity` uses `stateAlwaysHidden|adjustNothing`, and every text field in the app's own screens hides the keyboard when it gains focus, so a keyboard can never push the layout around.
            - **Elevation toggle changes are logged immediately** — `shell_elevation_enabled` and `shell_auto_allow_elevation` changes bypass the settings change logger's 2-second coalescing, so a change can no longer be lost when the process dies right after it (e.g. during a reinstall).
            - **Root tools (71 tools total)** — `android_install_apk` (`pm install -r`), `android_uninstall_app` (`pm uninstall`), `android_reboot_device` (`reboot`, logged before it runs), `android_read_logcat` and `android_read_root_file` (any absolute path). Each runs one fixed command through the existing elevation authorization — blocklist, elevation-enabled check, auto-allow / allowlist / user approval, mandatory justification — with no bypass.
