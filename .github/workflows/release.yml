name: Release

# Fork release pipeline (sampple-korea/android-remote-control-mcp).
#
# Adapted from the upstream release workflow to this fork's setup:
# - Builds only the FOSS release APK, signed with a test keystore kept in the
#   SIGNING_* Actions secrets (the key does not need to be preserved across
#   releases; it only has to make the APK installable).
# - Runs the FOSS unit tests before building.
# - Publishes the release immediately (upstream created a draft and waited on
#   CI checks that never run for tag pushes on this fork).
# - Version name comes from the tag (passed as -PVERSION_NAME); versionCode is
#   derived by Gradle from git history, so a full-history checkout is required.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish a release for (e.g. v1.13.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # Go toolchain that compiles the bundled cloudflared. Its crypto/x509 decides which certificate
  # chains cloudflared trusts, so it is part of the cloudflared cache key (same as CI).
  CLOUDFLARED_GO_VERSION: '1.27.3'

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # ── 1. Resolve the tag (push event: ref name; manual run: input) ──
      - name: Resolve tag and version
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::Invalid version format: $VERSION (expected MAJOR.MINOR.PATCH[-suffix])"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 2. Checkout the tag, full history + submodules (Gradle derives the
      #        versionCode from git history and refuses release builds from
      #        shallow clones) ──
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.vars.outputs.tag }}
          fetch-depth: 0
          submodules: true

      # ── 3. Toolchains ──
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      # Use the runner image's preinstalled Android SDK (same as upstream CI).
      # android-actions/setup-android@v3 fails here: its default package list
      # includes the legacy 'tools' package, which no longer exists in
      # cmdline-tools 16, so sdkmanager exits 1.
      - name: Install Android platform (compileSdk 37)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # ── 4. Restore the test signing keystore and write keystore.properties.
      #        app/build.gradle.kts applies the release signingConfig only when
      #        keystore.properties exists at the repo root; without this step the
      #        release APK builds unsigned. ──
      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is not set; the release APK would be unsigned"
            exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          {
            echo "storeFile=$GITHUB_WORKSPACE/release.jks"
            echo "storePassword=$SIGNING_STORE_PASSWORD"
            echo "keyAlias=$SIGNING_KEY_ALIAS"
            echo "keyPassword=$SIGNING_KEY_PASSWORD"
          } > "$GITHUB_WORKSPACE/keystore.properties"

      # ── 5. Unit tests gate the release ──
      - name: Run FOSS unit tests
        run: ./gradlew :app:testFossDebugUnitTest

      # ── 6. Native dependencies (same steps/caches as the CI build-release job) ──
      - name: Resolve cloudflared build inputs
        id: cloudflared-inputs
        run: |
          echo "commit=$(git rev-parse HEAD:vendor/cloudflared)" >> "$GITHUB_OUTPUT"
          echo "ndk=$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Cache cloudflared Android native
        id: cache-cloudflared
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libcloudflared.so
            app/src/main/jniLibs/x86_64/libcloudflared.so
          key: cloudflared-android-${{ runner.os }}-go${{ env.CLOUDFLARED_GO_VERSION }}-ndk${{ steps.cloudflared-inputs.outputs.ndk }}-${{ steps.cloudflared-inputs.outputs.commit }}-${{ hashFiles('.gitmodules', 'Makefile', 'vendor/cloudflared/**/*.go', 'vendor/cloudflared/go.mod', 'vendor/cloudflared/go.sum') }}

      - name: Cache ngrok-java Android native
        id: cache-ngrok-android
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libngrok_java.so
            app/src/main/jniLibs/x86_64/libngrok_java.so
            vendor/ngrok-java/ngrok-java/target/ngrok-java-1.2.0-SNAPSHOT.jar
            vendor/ngrok-java/ngrok-java-native/target/ngrok-java-native-classes.jar
          key: ngrok-android-v2-${{ runner.os }}-${{ hashFiles('.gitmodules', 'vendor/ngrok-java/**/*.toml', 'vendor/ngrok-java/**/pom.xml', 'vendor/ngrok-java/ngrok-java-native/src/**', 'vendor/ngrok-java/**/Cargo.lock', 'vendor/ngrok-java/ngrok-java-native/build.rs') }}

      - name: Set up Go
        if: steps.cache-cloudflared.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.CLOUDFLARED_GO_VERSION }}

      - name: Set up Rust
        if: steps.cache-ngrok-android.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Compile cloudflared for Android
        if: steps.cache-cloudflared.outputs.cache-hit != 'true'
        run: make compile-cloudflared

      - name: Compile ngrok-java native for Android
        if: steps.cache-ngrok-android.outputs.cache-hit != 'true'
        run: make compile-ngrok-native
        env:
          JAVA_11_HOME: ${{ env.JAVA_HOME }}
          JAVA_17_HOME: ${{ env.JAVA_HOME }}

      # ── 7. Geolocation DB toolchain (generated at build time from DB-IP City Lite) ──
      - name: Set up Python (geolocation DB generator)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compute DB-IP month
        id: dbip-month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache DB-IP source CSV
        uses: actions/cache@v6
        with:
          path: .dbip-cache
          key: dbip-csv-${{ steps.dbip-month.outputs.month }}

      # ── 8. Build the signed FOSS release APK (version name from the tag) ──
      - name: Build FOSS release APK
        run: ./gradlew :app:assembleFossRelease -PVERSION_NAME="${{ steps.vars.outputs.version }}"

      - name: Collect APK
        id: apk
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          mkdir -p release-assets
          src="app/build/outputs/apk/foss/release/app-foss-release.apk"
          if [ ! -f "$src" ]; then
            echo "::error::Signed FOSS release APK not found at $src (an unsigned build would land at app-foss-release-unsigned.apk)"
            ls -la app/build/outputs/apk/foss/release/ || true
            exit 1
          fi
          dest="release-assets/android-remote-control-mcp-${TAG}-foss-release.apk"
          cp "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"
          ls -lh release-assets/

      # ── 9. Publish the release with the APK attached ──
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          prerelease: ${{ steps.vars.outputs.prerelease }}
          files: ${{ steps.apk.outputs.path }}
          body: |
            Fork release of android-remote-control-mcp, built from this repository by GitHub Actions and signed with a test key. Uninstall any upstream-signed copy before installing (signatures differ). Requires Android 13+.

            ## Fork changes since upstream v1.13.0

            - **Screen-state diff mode** — `android_get_screen_state` can return only the nodes added/changed/removed since the previous capture (opt-in `diff`), cutting token usage on repeated screen reads.
            - **Settle-then-capture** — opt-in `settle` / `settle_timeout_ms` waits for the UI tree to stop changing before capturing screen state.
            - **`android_batch_actions`** — new tool that runs a sequence of UI actions in a single MCP call (allowlist of 29 action tools; stops at the first failure unless `continue_on_error` is set).
            - **`interactive_only` snapshot filter** — opt-in `android_get_screen_state` filter that keeps only interactive elements (clickable, long-clickable, editable, scrollable, or carrying accessibility actions); composes with diff mode.
